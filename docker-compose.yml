services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gauge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gauge
      POSTGRES_PASSWORD: gauge_dev_password
      POSTGRES_DB: gauge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: gauge-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: